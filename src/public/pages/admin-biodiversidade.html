<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Gerenciar Biodiversidade</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="../css/style.css">

</head>


<body>


<nav class="navbar navbar-dark bg-success">

<div class="container">

<a class="navbar-brand" href="dashboard.html">

← Dashboard

</a>

</div>

</nav>



<div class="container mt-5">


<h2 class="mb-4">

Gerenciar Biodiversidade

</h2>



<form id="formBiodiversidade">


<input
type="hidden"
id="id">



<div class="mb-3">

<label>Nome</label>

<input
class="form-control"
id="nome"
required>

</div>



<div class="row">


<div class="col-md-6">


<label>Categoria</label>

<select
class="form-control"
id="categoria">


<option>Fauna</option>

<option>Flora</option>

<option>Ecossistema</option>

<option>Outro</option>


</select>


</div>



<div class="col-md-6">


<label>Status</label>

<select
class="form-control"
id="status">


<option>Ativo</option>

<option>Inativo</option>


</select>


</div>


</div>



<div class="mb-3 mt-3">


<label>Localização</label>


<input
class="form-control"
id="localizacao">


</div>




<div class="mb-3">


<label>Descrição</label>


<textarea
class="form-control"
id="descricao"></textarea>


</div>




<button
type="submit"
class="btn btn-success mt-3">


Salvar Biodiversidade


</button>




<button
type="button"
class="btn btn-secondary mt-3 ms-2"
onclick="limparFormulario()">



Cancelar


</button>



</form>




<hr class="my-5">




<table class="table table-bordered">


<thead>


<tr>


<th>Nome</th>

<th>Categoria</th>

<th>Localização</th>

<th>Status</th>

<th width="180">

Ações

</th>


</tr>


</thead>



<tbody id="listaBiodiversidades">


</tbody>


</table>



</div>




<script src="../js/admin-biodiversidades.js"></script>



</body>

</html>
