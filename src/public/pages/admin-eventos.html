<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Gerenciar Eventos</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="../css/style.css">

</head>

<body>

<nav class="navbar navbar-dark bg-success">

<div class="container">

<a class="navbar-brand" href="dashboard.html">

← Dashboard

</a>

</div>

</nav>

<div class="container mt-5">

<h2 class="mb-4">

Gerenciar Eventos

</h2>

<form id="formEvento">

<input
type="hidden"
id="id">

<div class="mb-3">

<label>Título</label>

<input
class="form-control"
id="titulo"
required>

</div>

<div class="mb-3">

<label>Descrição</label>

<textarea
class="form-control"
id="descricao"></textarea>

</div>

<div class="row">

<div class="col-md-6">

<label>Data</label>

<input
type="date"
class="form-control"
id="data">

</div>

<div class="col-md-6">

<label>Status</label>

<select
class="form-control"
id="status">

<option>Ativo</option>

<option>Cancelado</option>

<option>Encerrado</option>

</select>

</div>

</div>

<button
type="submit"
class="btn btn-success mt-4">

    Salvar Evento

</button>

<button
type="button"
class="btn btn-secondary mt-4 ms-2"
onclick="limparFormulario()">

    Cancelar

</button>

</form>

<hr class="my-5">

<table class="table table-bordered">

<thead>

<tr>

<th>Título</th>

<th>Data</th>

<th>Status</th>

<th width="180">

Ações

</th>

</tr>

</thead>

<tbody id="listaEventos">

</tbody>

</table>

</div>

<script src="../js/admin-eventos.js"></script>

</body>

</html>
