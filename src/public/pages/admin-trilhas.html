<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Gerenciar Trilhas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

<nav class="navbar navbar-dark bg-success">

    <div class="container">

        <a class="navbar-brand" href="dashboard.html">

            ← Dashboard

        </a>

    </div>

</nav>

<div class="container mt-5">

    <h2 class="mb-4">

        Gerenciar Trilhas

    </h2>

    <form id="formTrilha">

        <input
            type="hidden"
            id="id">

        <div class="mb-3">

            <label class="form-label">

                Nome

            </label>

            <input
                class="form-control"
                id="nome"
                required>

        </div>

        <div class="row">

            <div class="col-md-4">

                <label class="form-label">

                    Dificuldade

                </label>

                <select
                    id="dificuldade"
                    class="form-select">

                    <option>Fácil</option>
                    <option>Média</option>
                    <option>Difícil</option>

                </select>

            </div>

            <div class="col-md-4">

                <label class="form-label">

                    Distância

                </label>

                <input
                    id="distancia"
                    class="form-control"
                    placeholder="Ex.: 4 km">

            </div>

            <div class="col-md-4">

                <label class="form-label">

                    Status

                </label>

                <select
                    id="status"
                    class="form-select">

                    <option>Aberta</option>
                    <option>Fechada</option>
                    <option>Manutenção</option>

                </select>

            </div>

        </div>

        <button
            type="submit"
            class="btn btn-success mt-4">

            Salvar Trilha

        </button>

        <button
            type="button"
            class="btn btn-secondary mt-4 ms-2"
            onclick="limparFormulario()">

            Cancelar

        </button>

    </form>

    <hr class="my-5">

    <table class="table table-striped table-hover align-middle">

        <thead>

            <tr>

                <th>Nome</th>

                <th>Dificuldade</th>

                <th>Distância</th>

                <th>Status</th>

                <th width="180">

                    Ações

                </th>

            </tr>

        </thead>

        <tbody id="listaTrilhas">

        </tbody>

    </table>

</div>

<script src="../js/admin-trilhas.js"></script>

</body>

</html>
