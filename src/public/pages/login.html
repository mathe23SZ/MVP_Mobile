<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>Login Administrador</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
rel="stylesheet">

<link rel="stylesheet"
href="../css/style.css">

</head>

<body class="bg-light">

<div class="container">

<div class="row justify-content-center align-items-center vh-100">

<div class="col-md-5">

<div class="card shadow-lg border-0">

<div class="card-body p-5">

<h2 class="text-center mb-4 text-success">

🌿 Circuito Terê Verde

</h2>

<h5 class="text-center mb-4">

Área do Administrador

</h5>

<form id="loginForm">

<div class="mb-3">

<label class="form-label">

Usuário

</label>

<input

type="text"

class="form-control"

id="usuario"

required>

</div>

<div class="mb-4">

<label class="form-label">

Senha

</label>

<input

type="password"

class="form-control"

id="senha"

required>

</div>

<div
id="mensagem"

class="alert d-none">

</div>

<button
class="btn btn-success w-100">

Entrar

</button>

<a
href="index.html"
class="btn btn-outline-secondary w-100 mt-3">

Voltar ao Site

</a>

</form>

</div>

</div>

</div>

</div>

</div>

<script src="../js/login.js"></script>

</body>

</html>
